{% extends "base.html" %}
{% block title %}Book Appointment - Meedicoapp{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h4 class="fw-bold mb-3"><i class="bi bi-calendar-plus"></i> Book an OP Appointment</h4>
                <form method="POST" action="{{ url_for('book_appointment') }}">
                    <div class="mb-3">
                        <label class="form-label">Select Doctor</label>
                        <select name="doctor_id" class="form-select" required>
                            <option value="" disabled selected>Choose a doctor...</option>
                            {% for d in doctors %}
                            <option value="{{ d.id }}">
                                {{ d.name }} &mdash; {{ d.specialization }} (₹{{ "%.0f"|format(d.fee) }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Preferred Date</label>
                            <input type="date" name="appointment_date" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Preferred Time</label>
                            <input type="time" name="appointment_time" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Reason for visit (optional)</label>
                        <textarea name="reason" class="form-control" rows="3" placeholder="Briefly describe your symptoms or reason for visit"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-check-circle"></i> Confirm Booking
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
